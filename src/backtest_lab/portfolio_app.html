<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 股票池管理中控台</title>
  <style>
    :root {
      --ink: #182026;
      --muted: #66737d;
      --line: #dce3e8;
      --panel: #ffffff;
      --canvas: #f3f6f7;
      --navy: #16232d;
      --green: #11795b;
      --blue: #2457a7;
      --amber-bg: #fff7e6;
      --amber-line: #f0d89a;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 14px; }
    header { background: var(--navy); color: white; padding: 18px 24px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 21px; }
    h2 { margin: 0; font-size: 16px; }
    h3 { margin: 0; font-size: 15px; }
    button, input, textarea, select { font: inherit; }
    button { min-height: 36px; border: 1px solid var(--navy); border-radius: 5px; background: var(--navy); color: white; padding: 7px 12px; font-weight: 700; cursor: pointer; }
    button.secondary { background: white; color: var(--navy); }
    button.danger { background: white; color: var(--red); border-color: var(--red); }
    button.micro { min-height: 28px; padding: 4px 7px; font-size: 12px; border-color: #9caeba; background: white; color: var(--navy); }
    button.micro.selected { border-color: var(--green); background: #eefaf6; color: var(--green); }
    button.micro.reject { border-color: #d69a93; color: var(--red); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, textarea, select { width: 100%; border: 1px solid #c8d2d9; border-radius: 5px; padding: 9px 10px; background: white; color: var(--ink); }
    textarea { min-height: 180px; resize: vertical; line-height: 1.55; }
    main { max-width: 1400px; margin: 0 auto; padding: 18px; display: grid; gap: 14px; }
    .subtle { color: #b9c5cd; font-size: 12px; margin-top: 4px; }
    .badge { border: 1px solid #60717f; border-radius: 5px; padding: 6px 9px; font-size: 12px; white-space: nowrap; }
    .notice { background: var(--amber-bg); border: 1px solid var(--amber-line); border-radius: 6px; padding: 12px 14px; color: #7a4b00; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(360px, .85fr); gap: 14px; align-items: start; }
    section, .pool-card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
    section { padding: 15px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .pool-list { display: grid; gap: 10px; }
    .pool-card { padding: 14px; display: grid; gap: 10px; cursor: pointer; }
    .pool-card.selected { border-color: #6a93ca; box-shadow: 0 0 0 2px rgba(36, 87, 167, .10); }
    .pool-meta { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill { border: 1px solid #c7d2da; background: #f8fafb; border-radius: 999px; padding: 4px 8px; color: var(--muted); font-size: 12px; }
    .pill.green { color: var(--green); border-color: #acd9ca; background: #eefaf6; }
    .pill.blue { color: var(--blue); border-color: #bfd1ec; background: #f0f5ff; }
    .symbols { display: flex; flex-wrap: wrap; gap: 6px; }
    .symbol { border: 1px solid #d8e1e7; background: #fbfcfd; border-radius: 5px; padding: 6px 8px; }
    .observation-list { display: grid; gap: 8px; margin-bottom: 12px; }
    .observation-row { border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; padding: 10px; display: grid; gap: 6px; }
    .observation-row.skipped { background: #fff7f5; border-color: #f1c3bd; }
    .observation-title { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .observation-title strong { overflow-wrap: anywhere; }
    .review-list { display: grid; gap: 8px; margin-bottom: 12px; }
    .review-row { border: 1px solid var(--line); border-radius: 6px; background: #ffffff; padding: 11px; display: grid; gap: 8px; }
    .review-row.ready { border-left: 5px solid var(--green); }
    .review-row.waiting { border-left: 5px solid #c78912; }
    .review-body { display: grid; gap: 6px; color: var(--muted); line-height: 1.55; }
    .review-candidates { display: flex; flex-wrap: wrap; gap: 6px; }
    .review-candidate { border: 1px solid #d8e1e7; background: #fbfcfd; border-radius: 5px; padding: 7px; color: var(--ink); font-size: 12px; display: grid; gap: 6px; min-width: 170px; }
    .review-candidate-title { font-weight: 800; }
    .review-decision { color: var(--green); font-weight: 700; }
    .mini-actions { display: flex; flex-wrap: wrap; gap: 5px; }
    .draft-list { display: grid; gap: 6px; margin-top: 8px; }
    .draft-row { border: 1px dashed #c8d2d9; border-radius: 5px; padding: 8px; background: #fbfcfd; line-height: 1.55; }
    .empty { color: var(--muted); padding: 10px 0; }
    form { display: grid; gap: 11px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
    .tab { background: white; color: var(--navy); border-color: #9caeba; }
    .tab.active { background: var(--navy); color: white; border-color: var(--navy); }
    .status { min-height: 18px; color: var(--green); font-size: 12px; }
    .error { color: var(--red); }
    .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .metric { background: #f8fafb; border: 1px solid var(--line); border-radius: 6px; padding: 11px; min-width: 0; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 5px; font-weight: 800; overflow-wrap: anywhere; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      header { align-items: flex-start; padding: 14px; }
      main { padding: 10px; }
      .section-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI 股票池管理中控台</h1>
      <div class="subtle" id="signal-meta">讀取模型訊號與股票池設定...</div>
    </div>
    <div class="badge">Pool Manager · 8765</div>
  </header>

  <main>
    <div class="notice">
      此頁面分成「正式三池」與「實驗池」。正式三池是每日正式分析與表決的基礎，池本身不可刪除，但內容可由程式自動更新或手動調整；實驗池用來放額外驗證、影片題目與臨時研究。
    </div>

    <div class="layout">
      <section>
        <div class="section-head">
          <h2 id="pool-section-title">正式三池</h2>
          <div class="actions">
            <button class="secondary" type="button" id="sync-pools">同步股票池</button>
            <button class="secondary" type="button" id="sync-pools-run">同步並產報告</button>
            <button class="secondary" type="button" id="new-pool">新增自訂池</button>
          </div>
        </div>
        <div class="tabs">
          <button class="tab active" type="button" data-view="official_core">正式三池</button>
          <button class="tab" type="button" data-view="experiment">實驗池</button>
        </div>
        <div class="detail-grid" id="summary"></div>
        <div class="section-head">
          <h2>最新觀察結果</h2>
          <span class="pill" id="observation-date">尚未讀取</span>
        </div>
        <div class="observation-list" id="observation-list"></div>
        <div class="section-head">
          <h2>月頻候選審核</h2>
          <div class="actions">
            <span class="pill" id="candidate-review-date">尚未讀取</span>
            <button class="secondary" type="button" id="preview-review-draft">查看套用草案</button>
            <button class="danger" type="button" id="apply-review-draft">確認套用草案</button>
          </div>
        </div>
        <div class="review-list" id="candidate-review-list"></div>
        <div class="draft-list" id="candidate-review-draft"></div>
        <div class="pool-list" id="pool-list"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>股票池編輯</h2>
          <span class="pill blue" id="edit-kind">未選取</span>
        </div>
        <form id="pool-form">
          <input id="pool-id" type="hidden">
          <label>股票池名稱
            <input id="pool-name" placeholder="例如：我的AI觀察池">
          </label>
          <label>策略預設
            <select id="strategy-preset">
              <option value="universal_pool_custom">通用股票池預設參數版</option>
              <option value="ai_theme_large_cap_v20260613">AI主線攻擊池 v20260613</option>
              <option value="core_defensive_style_v1">核心防守風格池 v1</option>
              <option value="best_v20260605">AI中大型權值股最佳版 v20260605</option>
              <option value="radar_core_mid_small_calibrated_v1">雷達中小型校準版</option>
              <option value="delayed_public_scorecard_v1">模型延遲公開成績單</option>
            </select>
          </label>
          <label>股票代號，一行一檔
            <textarea id="symbols-text" placeholder="2330&#10;2454&#10;00631L"></textarea>
          </label>
          <label>說明
            <input id="description" placeholder="這個池的用途">
          </label>
          <div class="notice" id="dynamic-note">
            正式三池是每日正式分析來源；實驗池可用來追蹤延遲公開成績單、影片題材或臨時策略。動態池會依模型訊號或指定資料源更新候選標的。
          </div>
          <div class="actions">
            <button class="danger" type="button" id="delete-pool">刪除自訂池</button>
            <button type="submit">儲存股票池</button>
          </div>
          <div class="status" id="status"></div>
        </form>
      </section>
    </div>
  </main>

  <script>
    let state = { pools: [], latest_signal: null };
    let observationState = { status: "loading", manifest: null };
    let candidateReviewState = { status: "loading", reviews: [] };
    let candidateDecisionState = { decisions: [], latest_by_key: {} };
    let candidateDraftState = null;
    let selectedPoolId = null;
    let currentView = "official_core";

    const byId = id => document.getElementById(id);
    const kindLabel = pool => {
      if (pool.ui_section === "official_core") return "正式核心";
      if (pool.ui_section === "experiment" || pool.kind === "task") return "實驗/任務";
      if (pool.locked) return "內建保護";
      return "自訂池";
    };
    const currentPools = () => (state.pool_sections?.[currentView] || [])
      .filter(pool => pool.ui_section !== "legacy");
    const sectionByPoolId = () => {
      const mapping = {};
      for (const [section, pools] of Object.entries(state.pool_sections || {})) {
        for (const pool of pools) mapping[pool.pool_id] = section;
      }
      return mapping;
    };
    const symbolText = symbols => symbols.map(item => item.symbol).join("\n");

    async function refresh() {
      const response = await fetch("/api/pools");
      state = await response.json();
      const observationResponse = await fetch("/api/observations");
      observationState = await observationResponse.json();
      const candidateReviewResponse = await fetch("/api/candidate-reviews");
      candidateReviewState = await candidateReviewResponse.json();
      const candidateDecisionResponse = await fetch("/api/candidate-review-decisions");
      candidateDecisionState = await candidateDecisionResponse.json();
      if (!selectedPoolId && currentPools().length) selectedPoolId = currentPools()[0].pool_id;
      render();
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll("[data-view]").forEach(node => {
        node.classList.toggle("active", node.dataset.view === currentView);
      });
      const pools = currentPools();
      if (!pools.some(pool => pool.pool_id === selectedPoolId)) selectedPoolId = pools[0]?.pool_id || null;
      render();
    }

    function render() {
      const pools = currentPools();
      const signal = state.latest_signal;
      byId("signal-meta").textContent = signal
        ? `最新模型訊號：${signal.signal_date} · ${signal.target_ticker || "現金"}`
        : "尚未讀到最新模型訊號，動態池會使用 fallback。";
      byId("pool-section-title").textContent = currentView === "official_core" ? "正式三池" : "實驗池";
      byId("summary").innerHTML = `
        <div class="metric"><div class="metric-label">目前頁籤池數</div><div class="metric-value">${pools.length}</div></div>
        <div class="metric"><div class="metric-label">不可刪除池</div><div class="metric-value">${pools.filter(pool => pool.locked).length}</div></div>
        <div class="metric"><div class="metric-label">自動更新池</div><div class="metric-value">${pools.filter(pool => pool.dynamic_binding || pool.dynamic_constituents).length}</div></div>`;
      renderObservations();
      renderCandidateReviews();
      renderCandidateDraft();
      byId("pool-list").innerHTML = pools.length
        ? pools.map(pool => poolCard(pool)).join("")
        : `<div class="empty">此頁籤目前沒有股票池。</div>`;
      document.querySelectorAll("[data-pool-id]").forEach(node => {
        node.addEventListener("click", () => {
          selectedPoolId = node.dataset.poolId;
          render();
        });
      });
      document.querySelectorAll("[data-review-action]").forEach(node => {
        node.addEventListener("click", event => {
          event.stopPropagation();
          recordCandidateDecision(node);
        });
      });
      renderEditor();
    }

    function renderObservations() {
      const manifest = observationState.manifest;
      if (!manifest) {
        byId("observation-date").textContent = observationState.status === "error" ? "讀取失敗" : "尚無資料";
        byId("observation-list").innerHTML = `<div class="empty">${observationState.message || "尚未產出股票池觀察結果。"}</div>`;
        return;
      }
      byId("observation-date").textContent = `訊號日 ${manifest.signal_date}`;
      const sections = sectionByPoolId();
      const generated = (manifest.generated || [])
        .filter(item => sections[item.pool_id] === currentView)
        .map(item => observationRow(item, false)).join("");
      const skipped = (manifest.skipped || [])
        .filter(item => sections[item.pool_id] === currentView)
        .map(item => observationRow(item, true)).join("");
      byId("observation-list").innerHTML = generated + skipped || `<div class="empty">manifest 沒有可顯示項目。</div>`;
    }

    function renderCandidateReviews() {
      if (currentView !== "official_core") {
        byId("candidate-review-date").textContent = "正式三池限定";
        byId("candidate-review-list").innerHTML = `<div class="empty">實驗池不參與三池月頻候選審核。</div>`;
        return;
      }
      const reviews = candidateReviewState.reviews || [];
      if (!reviews.length) {
        byId("candidate-review-date").textContent = candidateReviewState.status === "missing_signal" ? "缺訊號日" : "尚無資料";
        byId("candidate-review-list").innerHTML = `<div class="empty">${candidateReviewState.message || "尚未產生候選審核狀態。"}</div>`;
        return;
      }
      byId("candidate-review-date").textContent = `訊號日 ${candidateReviewState.signal_date}`;
      byId("candidate-review-list").innerHTML = reviews.map(reviewRow).join("");
    }

    function reviewRow(review) {
      const ready = review.source_status === "source_ready";
      const candidates = (review.source_candidates || []).slice(0, 5);
      const candidateHtml = candidates.length
        ? candidates.map(item => reviewCandidate(review, item)).join("")
        : `<span class="empty">此來源不提供候選明細，依目前池成員或外部成分股資料判斷。</span>`;
      return `<div class="review-row ${ready ? "ready" : "waiting"}">
        <div class="observation-title">
          <strong>${review.pool_name}</strong>
          <span class="pill ${ready ? "green" : ""}">${review.decision}</span>
        </div>
        <div class="pool-meta">
          <span class="pill">${review.frequency}</span>
          <span class="pill">${review.source_mode}</span>
          <span class="pill">${review.source_status}</span>
          <span class="pill">目前 ${review.candidate_count} 檔</span>
          <span class="pill">來源 active ${review.source_active_count || 0} / watch ${review.source_watch_count || 0}</span>
        </div>
        <div class="review-body">
          <div>來源：${review.source_path || "由動態成分股或現有池設定提供"}</div>
          <div class="review-candidates">${candidateHtml}</div>
        </div>
      </div>`;
    }

    function decisionKey(poolId, ticker) {
      return `${poolId}|${ticker}`;
    }

    function reviewCandidate(review, item) {
      const current = candidateDecisionState.latest_by_key?.[decisionKey(review.pool_id, item.ticker)];
      const decisionText = current ? `<div class="review-decision">${current.decision_label} · ${current.signal_date}</div>` : "";
      const selected = decision => current?.decision === decision ? " selected" : "";
      return `<div class="review-candidate">
        <div class="review-candidate-title">${item.display}${item.review_status === "watch" ? " · watch" : ""}</div>
        ${decisionText}
        <div class="mini-actions">
          <button class="micro${selected("approve_add")}" type="button" data-review-action="approve_add" data-pool-id="${review.pool_id}" data-pool-name="${review.pool_name}" data-ticker="${item.ticker}" data-display="${item.display}" data-source-status="${review.source_status}">列入</button>
          <button class="micro${selected("keep_watch")}" type="button" data-review-action="keep_watch" data-pool-id="${review.pool_id}" data-pool-name="${review.pool_name}" data-ticker="${item.ticker}" data-display="${item.display}" data-source-status="${review.source_status}">觀察</button>
          <button class="micro${selected("keep_current")}" type="button" data-review-action="keep_current" data-pool-id="${review.pool_id}" data-pool-name="${review.pool_name}" data-ticker="${item.ticker}" data-display="${item.display}" data-source-status="${review.source_status}">維持</button>
          <button class="micro reject${selected("reject")}" type="button" data-review-action="reject" data-pool-id="${review.pool_id}" data-pool-name="${review.pool_name}" data-ticker="${item.ticker}" data-display="${item.display}" data-source-status="${review.source_status}">排除</button>
        </div>
      </div>`;
    }

    function renderCandidateDraft() {
      const target = byId("candidate-review-draft");
      if (currentView !== "official_core") {
        target.innerHTML = "";
        return;
      }
      if (!candidateDraftState) {
        target.innerHTML = "";
        return;
      }
      const changes = candidateDraftState.changes || [];
      const skipped = candidateDraftState.skipped || [];
      if (!changes.length && !skipped.length) {
        target.innerHTML = `<div class="empty">目前沒有可套用的候選審核決策草案。</div>`;
        return;
      }
      const changeRows = changes.map(item => `<div class="draft-row">
        <strong>${item.display}</strong> · ${item.pool_name}<br>
        ${item.action}：${item.current_status || "new"} -> ${item.draft_status}，來源 ${item.source_path}
      </div>`).join("");
      const skippedRows = skipped.map(item => `<div class="draft-row">
        <strong>${item.display || item.ticker}</strong> · 跳過：${item.reason}
      </div>`).join("");
      target.innerHTML = changeRows + skippedRows;
    }

    function observationRow(item, skipped) {
      const missing = item.missing_price_tickers?.length
        ? `<span class="pill">缺價 ${item.missing_price_tickers.join(", ")}</span>`
        : "";
      const status = skipped
        ? `<span class="pill">跳過：${item.reason}</span>`
        : `<span class="pill green">${item.action_state}</span>`;
      const target = skipped ? "未產出" : `${item.top_display || item.top_ticker || "無合格候選"}`;
      return `<div class="observation-row${skipped ? " skipped" : ""}">
        <div class="observation-title"><strong>${item.pool_name}</strong>${status}</div>
        <div class="pool-meta">
          <span class="pill blue">${target}</span>
          ${missing}
        </div>
      </div>`;
    }

    function poolCard(pool) {
      const selected = pool.pool_id === selectedPoolId ? " selected" : "";
      const symbols = pool.resolved_symbols || pool.symbols || [];
      const symbolHtml = symbols.length
        ? symbols.map(item => `<span class="symbol">${item.display}${item.source === "dynamic" ? " · 動態" : ""}</span>`).join("")
        : pool.dynamic_constituents
          ? `<span class="empty">此池由動態成分股資料產生候選股。</span>`
          : `<span class="empty">此池由雷達 snapshot 動態產生候選股，非固定清單。</span>`;
      return `<article class="pool-card${selected}" data-pool-id="${pool.pool_id}">
        <div class="section-head"><h3>${pool.name}</h3><span class="pill ${pool.locked ? "green" : "blue"}">${kindLabel(pool)}</span></div>
        <div class="pool-meta">
          <span class="pill">${pool.strategy_preset}</span>
          <span class="pill">${pool.dispatch?.report_line || "未分派"}</span>
          <span class="pill">${symbols.length} 檔</span>
          ${pool.dynamic_binding ? `<span class="pill blue">跟隨 ${pool.dynamic_binding.source_pool_id}</span>` : ""}
          ${pool.dynamic_constituents ? `<span class="pill blue">成分股自動更新</span>` : ""}
        </div>
        <div class="symbols">${symbolHtml}</div>
        <div class="empty">${pool.description || ""}</div>
      </article>`;
    }

    function renderEditor() {
      const pool = state.pools.find(item => item.pool_id === selectedPoolId);
      if (!pool) {
        byId("pool-id").value = "";
        byId("pool-name").value = "";
        byId("symbols-text").value = "";
        byId("description").value = "";
        byId("edit-kind").textContent = "新增";
        byId("delete-pool").disabled = true;
        return;
      }
      byId("pool-id").value = pool.pool_id;
      byId("pool-name").value = pool.name;
      byId("strategy-preset").value = pool.strategy_preset;
      byId("symbols-text").value = symbolText(pool.symbols || []);
      byId("description").value = pool.description || "";
      byId("edit-kind").textContent = kindLabel(pool);
      const locked = Boolean(pool.locked);
      const editableOfficial = pool.ui_section === "official_core";
      byId("pool-name").disabled = locked && !editableOfficial;
      byId("strategy-preset").disabled = locked && !editableOfficial;
      byId("symbols-text").disabled = locked && !editableOfficial;
      byId("description").disabled = locked && !editableOfficial;
      byId("delete-pool").disabled = locked;
    }

    document.querySelectorAll("[data-view]").forEach(node => {
      node.addEventListener("click", () => setView(node.dataset.view));
    });

    byId("new-pool").addEventListener("click", () => {
      setView("experiment");
      selectedPoolId = null;
      byId("pool-id").value = "";
      byId("pool-name").value = "";
      byId("strategy-preset").value = "universal_pool_custom";
      byId("symbols-text").value = "";
      byId("description").value = "";
      byId("edit-kind").textContent = "新增";
      byId("pool-name").disabled = false;
      byId("strategy-preset").disabled = false;
      byId("symbols-text").disabled = false;
      byId("description").disabled = false;
      byId("delete-pool").disabled = true;
    });

    byId("pool-form").addEventListener("submit", async event => {
      event.preventDefault();
      const status = byId("status");
      status.textContent = "儲存中...";
      status.className = "status";
      const payload = {
        pool_id: byId("pool-id").value,
        name: byId("pool-name").value,
        ui_section: currentView === "official_core" ? "official_core" : "experiment",
        strategy_preset: byId("strategy-preset").value,
        symbols_text: byId("symbols-text").value,
        description: byId("description").value,
      };
      const response = await fetch("/api/pools", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "儲存失敗";
        status.className = "status error";
        return;
      }
      state = data;
      selectedPoolId = payload.pool_id || currentPools().at(-1)?.pool_id || state.pools[state.pools.length - 1].pool_id;
      status.textContent = "已儲存";
      render();
    });

    byId("delete-pool").addEventListener("click", async () => {
      if (!selectedPoolId) return;
      const status = byId("status");
      status.textContent = "刪除中...";
      const response = await fetch(`/api/pools?pool_id=${encodeURIComponent(selectedPoolId)}`, { method: "DELETE" });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "刪除失敗";
        status.className = "status error";
        return;
      }
      state = data;
      selectedPoolId = currentPools()[0]?.pool_id || null;
      status.textContent = "已刪除";
      render();
    });

    async function syncPools(runAfterSync) {
      const status = byId("status");
      status.textContent = runAfterSync ? "同步股票池並觸發報告中..." : "同步股票池中...";
      status.className = "status";
      const endpoint = runAfterSync ? "/api/sync-pools-secret-and-run" : "/api/sync-pools-secret";
      const signalDate = state.latest_signal?.signal_date || "";
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({signal_date: signalDate})
      });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "同步失敗";
        status.className = "status error";
        return;
      }
      state = data;
      status.textContent = data.action_result ? "已同步股票池並觸發股票池觀察報告" : "已同步股票池到 GitHub secret";
      render();
    }

    byId("sync-pools").addEventListener("click", () => syncPools(false));
    byId("sync-pools-run").addEventListener("click", () => syncPools(true));
    byId("preview-review-draft").addEventListener("click", previewCandidateDecisionDraft);
    byId("apply-review-draft").addEventListener("click", applyCandidateDecisionDraft);

    async function recordCandidateDecision(node) {
      const status = byId("status");
      const note = window.prompt("補充備註，可留空", "") || "";
      status.textContent = "記錄候選審核決策中...";
      status.className = "status";
      const response = await fetch("/api/candidate-review-decisions", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          pool_id: node.dataset.poolId,
          pool_name: node.dataset.poolName,
          ticker: node.dataset.ticker,
          display: node.dataset.display,
          decision: node.dataset.reviewAction,
          signal_date: candidateReviewState.signal_date || state.latest_signal?.signal_date || "",
          source_status: node.dataset.sourceStatus,
          note
        })
      });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "候選審核決策記錄失敗";
        status.className = "status error";
        return;
      }
      candidateDecisionState = data;
      candidateDraftState = null;
      status.textContent = `已記錄：${data.recorded.display} · ${data.recorded.decision_label}`;
      render();
    }

    async function previewCandidateDecisionDraft() {
      const status = byId("status");
      status.textContent = "產生候選審核套用草案中...";
      status.className = "status";
      const response = await fetch("/api/candidate-review-decision-draft");
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "草案產生失敗";
        status.className = "status error";
        return;
      }
      candidateDraftState = data;
      status.textContent = `草案完成：${data.change_count} 筆變更，${data.skipped_count} 筆跳過`;
      render();
    }

    async function applyCandidateDecisionDraft() {
      const confirmed = window.confirm("這會把目前候選審核決策寫入候選來源 CSV，並先建立備份。確定要套用嗎？");
      if (!confirmed) return;
      const status = byId("status");
      status.textContent = "套用候選審核草案中...";
      status.className = "status";
      const response = await fetch("/api/candidate-review-decision-draft/apply", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({})
      });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "草案套用失敗";
        status.className = "status error";
        return;
      }
      candidateDraftState = null;
      status.textContent = `已套用：${data.applied_change_count} 筆變更，備份 ${data.applied_source_count} 個來源檔`;
      await refresh();
    }

    refresh();
  </script>
</body>
</html>
