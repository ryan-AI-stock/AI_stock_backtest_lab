<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 股票池管理中控台</title>
  <style>
    :root {
      --ink: #182026;
      --muted: #66737d;
      --line: #dce3e8;
      --panel: #ffffff;
      --canvas: #f3f6f7;
      --navy: #16232d;
      --green: #11795b;
      --blue: #2457a7;
      --amber-bg: #fff7e6;
      --amber-line: #f0d89a;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 14px; }
    header { background: var(--navy); color: white; padding: 18px 24px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 21px; }
    h2 { margin: 0; font-size: 16px; }
    h3 { margin: 0; font-size: 15px; }
    button, input, textarea, select { font: inherit; }
    button { min-height: 36px; border: 1px solid var(--navy); border-radius: 5px; background: var(--navy); color: white; padding: 7px 12px; font-weight: 700; cursor: pointer; }
    button.secondary { background: white; color: var(--navy); }
    button.danger { background: white; color: var(--red); border-color: var(--red); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, textarea, select { width: 100%; border: 1px solid #c8d2d9; border-radius: 5px; padding: 9px 10px; background: white; color: var(--ink); }
    textarea { min-height: 180px; resize: vertical; line-height: 1.55; }
    main { max-width: 1400px; margin: 0 auto; padding: 18px; display: grid; gap: 14px; }
    .subtle { color: #b9c5cd; font-size: 12px; margin-top: 4px; }
    .badge { border: 1px solid #60717f; border-radius: 5px; padding: 6px 9px; font-size: 12px; white-space: nowrap; }
    .notice { background: var(--amber-bg); border: 1px solid var(--amber-line); border-radius: 6px; padding: 12px 14px; color: #7a4b00; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(360px, .85fr); gap: 14px; align-items: start; }
    section, .pool-card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
    section { padding: 15px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .pool-list { display: grid; gap: 10px; }
    .pool-card { padding: 14px; display: grid; gap: 10px; cursor: pointer; }
    .pool-card.selected { border-color: #6a93ca; box-shadow: 0 0 0 2px rgba(36, 87, 167, .10); }
    .pool-meta { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill { border: 1px solid #c7d2da; background: #f8fafb; border-radius: 999px; padding: 4px 8px; color: var(--muted); font-size: 12px; }
    .pill.green { color: var(--green); border-color: #acd9ca; background: #eefaf6; }
    .pill.blue { color: var(--blue); border-color: #bfd1ec; background: #f0f5ff; }
    .symbols { display: flex; flex-wrap: wrap; gap: 6px; }
    .symbol { border: 1px solid #d8e1e7; background: #fbfcfd; border-radius: 5px; padding: 6px 8px; }
    .observation-list { display: grid; gap: 8px; margin-bottom: 12px; }
    .observation-row { border: 1px solid var(--line); border-radius: 6px; background: #fbfcfd; padding: 10px; display: grid; gap: 6px; }
    .observation-row.skipped { background: #fff7f5; border-color: #f1c3bd; }
    .observation-title { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .observation-title strong { overflow-wrap: anywhere; }
    .empty { color: var(--muted); padding: 10px 0; }
    form { display: grid; gap: 11px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .status { min-height: 18px; color: var(--green); font-size: 12px; }
    .error { color: var(--red); }
    .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .metric { background: #f8fafb; border: 1px solid var(--line); border-radius: 6px; padding: 11px; min-width: 0; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 5px; font-weight: 800; overflow-wrap: anywhere; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      header { align-items: flex-start; padding: 14px; }
      main { padding: 10px; }
      .section-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI 股票池管理中控台</h1>
      <div class="subtle" id="signal-meta">讀取模型訊號與股票池設定...</div>
    </div>
    <div class="badge">Pool Manager · 8765</div>
  </header>

  <main>
    <div class="notice">
      這個頁面取代舊版「AI 股票紀律工作台」。目前目標是管理不同股票池，讓每日報告、回測與未來私有部署都能依股票池設定執行。內建池會被保護；自訂池可以新增、修改與刪除。
    </div>

    <div class="layout">
      <section>
        <div class="section-head">
          <h2>股票池列表</h2>
          <button class="secondary" type="button" id="new-pool">新增自訂池</button>
        </div>
        <div class="detail-grid" id="summary"></div>
        <div class="section-head">
          <h2>最新觀察結果</h2>
          <span class="pill" id="observation-date">尚未讀取</span>
        </div>
        <div class="observation-list" id="observation-list"></div>
        <div class="pool-list" id="pool-list"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>股票池編輯</h2>
          <span class="pill blue" id="edit-kind">未選取</span>
        </div>
        <form id="pool-form">
          <input id="pool-id" type="hidden">
          <label>股票池名稱
            <input id="pool-name" placeholder="例如：我的AI觀察池">
          </label>
          <label>策略預設
            <select id="strategy-preset">
              <option value="universal_pool_custom">通用股票池預設參數版</option>
              <option value="best_v20260605">AI中大型權值股最佳版 v20260605</option>
              <option value="radar_core_mid_small_calibrated_v1">雷達中小型校準版</option>
              <option value="delayed_public_scorecard_v1">模型延遲公開成績單</option>
            </select>
          </label>
          <label>股票代號，一行一檔
            <textarea id="symbols-text" placeholder="2330&#10;2454&#10;00631L"></textarea>
          </label>
          <label>說明
            <input id="description" placeholder="這個池的用途">
          </label>
          <div class="notice" id="dynamic-note">
            池3目前設定為：0050、0050正二，加上跟隨「AI中大型權值股池最佳版 v20260605」每日模型第一名的第三檔股票。沒有最新訊號時，預設使用聯發科(2454)。
          </div>
          <div class="actions">
            <button class="danger" type="button" id="delete-pool">刪除自訂池</button>
            <button type="submit">儲存股票池</button>
          </div>
          <div class="status" id="status"></div>
        </form>
      </section>
    </div>
  </main>

  <script>
    let state = { pools: [], latest_signal: null };
    let observationState = { status: "loading", manifest: null };
    let selectedPoolId = null;

    const byId = id => document.getElementById(id);
    const kindLabel = pool => pool.locked ? "內建保護" : (pool.kind === "task" ? "任務池" : "自訂池");
    const symbolText = symbols => symbols.map(item => item.symbol).join("\n");

    async function refresh() {
      const response = await fetch("/api/pools");
      state = await response.json();
      const observationResponse = await fetch("/api/observations");
      observationState = await observationResponse.json();
      if (!selectedPoolId && state.pools.length) selectedPoolId = state.pools[0].pool_id;
      render();
    }

    function render() {
      const signal = state.latest_signal;
      byId("signal-meta").textContent = signal
        ? `最新模型訊號：${signal.signal_date} · ${signal.target_ticker || "現金"}`
        : "尚未讀到最新模型訊號，動態池會使用 fallback。";
      byId("summary").innerHTML = `
        <div class="metric"><div class="metric-label">股票池數量</div><div class="metric-value">${state.pools.length}</div></div>
        <div class="metric"><div class="metric-label">內建保護池</div><div class="metric-value">${state.pools.filter(pool => pool.locked).length}</div></div>
        <div class="metric"><div class="metric-label">動態跟隨池</div><div class="metric-value">${state.pools.filter(pool => pool.dynamic_binding).length}</div></div>`;
      renderObservations();
      byId("pool-list").innerHTML = state.pools.map(pool => poolCard(pool)).join("");
      document.querySelectorAll("[data-pool-id]").forEach(node => {
        node.addEventListener("click", () => {
          selectedPoolId = node.dataset.poolId;
          render();
        });
      });
      renderEditor();
    }

    function renderObservations() {
      const manifest = observationState.manifest;
      if (!manifest) {
        byId("observation-date").textContent = observationState.status === "error" ? "讀取失敗" : "尚無資料";
        byId("observation-list").innerHTML = `<div class="empty">${observationState.message || "尚未產出股票池觀察結果。"}</div>`;
        return;
      }
      byId("observation-date").textContent = `訊號日 ${manifest.signal_date}`;
      const generated = (manifest.generated || []).map(item => observationRow(item, false)).join("");
      const skipped = (manifest.skipped || []).map(item => observationRow(item, true)).join("");
      byId("observation-list").innerHTML = generated + skipped || `<div class="empty">manifest 沒有可顯示項目。</div>`;
    }

    function observationRow(item, skipped) {
      const missing = item.missing_price_tickers?.length
        ? `<span class="pill">缺價 ${item.missing_price_tickers.join(", ")}</span>`
        : "";
      const status = skipped
        ? `<span class="pill">跳過：${item.reason}</span>`
        : `<span class="pill green">${item.action_state}</span>`;
      const target = skipped ? "未產出" : `${item.top_display || item.top_ticker || "無合格候選"}`;
      return `<div class="observation-row${skipped ? " skipped" : ""}">
        <div class="observation-title"><strong>${item.pool_name}</strong>${status}</div>
        <div class="pool-meta">
          <span class="pill blue">${target}</span>
          ${missing}
        </div>
      </div>`;
    }

    function poolCard(pool) {
      const selected = pool.pool_id === selectedPoolId ? " selected" : "";
      const symbols = pool.resolved_symbols || pool.symbols || [];
      const symbolHtml = symbols.length
        ? symbols.map(item => `<span class="symbol">${item.display}${item.source === "dynamic" ? " · 動態" : ""}</span>`).join("")
        : `<span class="empty">此池由雷達 snapshot 動態產生候選股，非固定清單。</span>`;
      return `<article class="pool-card${selected}" data-pool-id="${pool.pool_id}">
        <div class="section-head"><h3>${pool.name}</h3><span class="pill ${pool.locked ? "green" : "blue"}">${kindLabel(pool)}</span></div>
        <div class="pool-meta">
          <span class="pill">${pool.strategy_preset}</span>
          <span class="pill">${symbols.length} 檔</span>
          ${pool.dynamic_binding ? `<span class="pill blue">跟隨 ${pool.dynamic_binding.source_pool_id}</span>` : ""}
        </div>
        <div class="symbols">${symbolHtml}</div>
        <div class="empty">${pool.description || ""}</div>
      </article>`;
    }

    function renderEditor() {
      const pool = state.pools.find(item => item.pool_id === selectedPoolId);
      if (!pool) {
        byId("pool-id").value = "";
        byId("pool-name").value = "";
        byId("symbols-text").value = "";
        byId("description").value = "";
        byId("edit-kind").textContent = "新增";
        byId("delete-pool").disabled = true;
        return;
      }
      byId("pool-id").value = pool.pool_id;
      byId("pool-name").value = pool.name;
      byId("strategy-preset").value = pool.strategy_preset;
      byId("symbols-text").value = symbolText(pool.symbols || []);
      byId("description").value = pool.description || "";
      byId("edit-kind").textContent = kindLabel(pool);
      const locked = Boolean(pool.locked);
      byId("pool-name").disabled = locked;
      byId("strategy-preset").disabled = locked;
      byId("symbols-text").disabled = locked;
      byId("description").disabled = locked;
      byId("delete-pool").disabled = locked;
    }

    byId("new-pool").addEventListener("click", () => {
      selectedPoolId = null;
      byId("pool-id").value = "";
      byId("pool-name").value = "";
      byId("strategy-preset").value = "universal_pool_custom";
      byId("symbols-text").value = "";
      byId("description").value = "";
      byId("edit-kind").textContent = "新增";
      byId("pool-name").disabled = false;
      byId("strategy-preset").disabled = false;
      byId("symbols-text").disabled = false;
      byId("description").disabled = false;
      byId("delete-pool").disabled = true;
    });

    byId("pool-form").addEventListener("submit", async event => {
      event.preventDefault();
      const status = byId("status");
      status.textContent = "儲存中...";
      status.className = "status";
      const payload = {
        pool_id: byId("pool-id").value,
        name: byId("pool-name").value,
        strategy_preset: byId("strategy-preset").value,
        symbols_text: byId("symbols-text").value,
        description: byId("description").value,
      };
      const response = await fetch("/api/pools", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "儲存失敗";
        status.className = "status error";
        return;
      }
      state = data;
      selectedPoolId = payload.pool_id || state.pools[state.pools.length - 1].pool_id;
      status.textContent = "已儲存";
      render();
    });

    byId("delete-pool").addEventListener("click", async () => {
      if (!selectedPoolId) return;
      const status = byId("status");
      status.textContent = "刪除中...";
      const response = await fetch(`/api/pools?pool_id=${encodeURIComponent(selectedPoolId)}`, { method: "DELETE" });
      const data = await response.json();
      if (!response.ok) {
        status.textContent = data.error || "刪除失敗";
        status.className = "status error";
        return;
      }
      state = data;
      selectedPoolId = state.pools[0]?.pool_id || null;
      status.textContent = "已刪除";
      render();
    });

    refresh();
  </script>
</body>
</html>
