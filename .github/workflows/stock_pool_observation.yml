name: Stock Pool Observation

on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: "Signal date in YYYY-MM-DD. Defaults to shared schedule target date."
        required: false
        type: string
      pool_id:
        description: "Stock pool id, or all."
        required: false
        type: string
        default: "all"
      radar_snapshot_dir:
        description: "Optional local radar snapshot dir inside the workspace."
        required: false
        type: string
  schedule:
    # Operational stock-pool overview. Uses same-day latest close data when available.
    - cron: "40 8 * * 1-5"

jobs:
  stock-pool-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared schedule rules
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          path: AI_stock_schedule_rules

      - name: Checkout rotation radar snapshots
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_rotation_radar
          path: AI_stock_rotation_radar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shared daily schedule gate
        id: schedule-gate
        shell: bash
        working-directory: AI_stock_schedule_rules
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          manual_args=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            manual_args="--manual-dispatch"
          fi
          python -m stock_schedule_rules.gate \
            --profile daily \
            $manual_args \
            --github-output "$GITHUB_OUTPUT"

      - name: Skip observation when schedule gate is closed
        if: steps.schedule-gate.outputs.should_run != 'true'
        run: |
          echo "Schedule gate closed: ${{ steps.schedule-gate.outputs.reason }}"
          echo "No stock-pool observation generated for this run."

      - name: Install dependencies and Chinese font
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve observation inputs
        if: steps.schedule-gate.outputs.should_run == 'true'
        id: observation-inputs
        shell: bash
        env:
          INPUT_SIGNAL_DATE: ${{ inputs.signal_date }}
          INPUT_POOL_ID: ${{ inputs.pool_id }}
          INPUT_RADAR_SNAPSHOT_DIR: ${{ inputs.radar_snapshot_dir }}
          VAR_RADAR_SNAPSHOT_DIR: ${{ vars.RADAR_SNAPSHOT_DIR }}
          VAR_MARKET_CAP_DATA_PATH: ${{ vars.MARKET_CAP_DATA_PATH }}
        run: |
          if [ -n "$INPUT_SIGNAL_DATE" ]; then
            echo "signal_date=$INPUT_SIGNAL_DATE" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.schedule-gate.outputs.target_date }}" ]; then
            echo "signal_date=${{ steps.schedule-gate.outputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "signal_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$INPUT_POOL_ID" ]; then
            echo "pool_id=$INPUT_POOL_ID" >> "$GITHUB_OUTPUT"
          else
            echo "pool_id=all" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$INPUT_RADAR_SNAPSHOT_DIR" ]; then
            echo "radar_snapshot_dir=$INPUT_RADAR_SNAPSHOT_DIR" >> "$GITHUB_OUTPUT"
          elif [ -n "$VAR_RADAR_SNAPSHOT_DIR" ]; then
            echo "radar_snapshot_dir=$VAR_RADAR_SNAPSHOT_DIR" >> "$GITHUB_OUTPUT"
          elif [ -d "AI_stock_rotation_radar/data/history" ]; then
            echo "radar_snapshot_dir=AI_stock_rotation_radar/data/history" >> "$GITHUB_OUTPUT"
          else
            echo "radar_snapshot_dir=" >> "$GITHUB_OUTPUT"
          fi
          if [ -d "AI_stock_rotation_radar/data" ]; then
            echo "radar_data_dir=AI_stock_rotation_radar/data" >> "$GITHUB_OUTPUT"
            if [ -n "$VAR_MARKET_CAP_DATA_PATH" ]; then
              echo "market_cap_data=$VAR_MARKET_CAP_DATA_PATH" >> "$GITHUB_OUTPUT"
            elif [ -f "AI_stock_rotation_radar/data/market_cap.latest.csv" ]; then
              echo "market_cap_data=AI_stock_rotation_radar/data/market_cap.latest.csv" >> "$GITHUB_OUTPUT"
            elif [ -f "AI_stock_rotation_radar/data/market_caps.latest.csv" ]; then
              echo "market_cap_data=AI_stock_rotation_radar/data/market_caps.latest.csv" >> "$GITHUB_OUTPUT"
            elif [ -f "AI_stock_rotation_radar/data/stock_metrics.refreshed.csv" ]; then
              echo "market_cap_data=AI_stock_rotation_radar/data/stock_metrics.refreshed.csv" >> "$GITHUB_OUTPUT"
            else
              echo "market_cap_data=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "radar_data_dir=" >> "$GITHUB_OUTPUT"
            echo "market_cap_data=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare optional stock pool store
        if: steps.schedule-gate.outputs.should_run == 'true'
        shell: bash
        env:
          STOCK_POOLS_JSON: ${{ secrets.STOCK_POOLS_JSON }}
        run: |
          if [ -n "$STOCK_POOLS_JSON" ]; then
            mkdir -p work/stock_pools
            printf '%s' "$STOCK_POOLS_JSON" > work/stock_pools/stock_pools.json
          fi

      - name: Update TW50 constituent snapshot
        if: steps.schedule-gate.outputs.should_run == 'true'
        shell: bash
        env:
          PYTHONPATH: src
          TW50_CONSTITUENTS_SOURCE_URL: ${{ secrets.TW50_CONSTITUENTS_SOURCE_URL || vars.TW50_CONSTITUENTS_SOURCE_URL }}
          TW50_CONSTITUENTS_SOURCE_CSV: ${{ vars.TW50_CONSTITUENTS_SOURCE_CSV }}
        run: |
          date_key="${{ steps.observation-inputs.outputs.signal_date }}"
          date_key="${date_key//-/}"
          output_dir="outputs/stock_pool_observations/${date_key}"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"
          source_args=()
          if [ -n "$TW50_CONSTITUENTS_SOURCE_CSV" ]; then
            source_args+=(--source-csv "$TW50_CONSTITUENTS_SOURCE_CSV")
          elif [ -n "$TW50_CONSTITUENTS_SOURCE_URL" ]; then
            source_args+=(--source-url "$TW50_CONSTITUENTS_SOURCE_URL")
          fi
          python -m backtest_lab.tw50_constituents_update \
            --as-of-date "${{ steps.observation-inputs.outputs.signal_date }}" \
            --output data/tw50_constituents.csv \
            --seed data/tw50_constituents.seed.csv \
            --status-json "${output_dir}/tw50_constituents_update.json" \
            --allow-seed-fallback \
            "${source_args[@]}"

      - name: Generate stock-pool observations
        if: steps.schedule-gate.outputs.should_run == 'true'
        shell: bash
        env:
          PYTHONPATH: src
          RADAR_SNAPSHOT_DIR: ${{ steps.observation-inputs.outputs.radar_snapshot_dir }}
          RADAR_DATA_DIR: ${{ steps.observation-inputs.outputs.radar_data_dir }}
          MARKET_CAP_DATA_PATH: ${{ steps.observation-inputs.outputs.market_cap_data }}
          INSTITUTIONAL_FLOW_DATA_PATH: ${{ vars.INSTITUTIONAL_FLOW_DATA_PATH }}
          MARGIN_SHORT_DATA_PATH: ${{ vars.MARGIN_SHORT_DATA_PATH }}
          BORROW_LENDING_DATA_PATH: ${{ vars.BORROW_LENDING_DATA_PATH }}
          DAY_TRADING_DATA_PATH: ${{ vars.DAY_TRADING_DATA_PATH }}
          SENTIMENT_DATA_PATH: ${{ vars.SENTIMENT_DATA_PATH }}
        run: |
          date_key="${{ steps.observation-inputs.outputs.signal_date }}"
          date_key="${date_key//-/}"
          radar_args=()
          if [ -n "$RADAR_SNAPSHOT_DIR" ]; then
            radar_args+=(--radar-snapshot-dir "$RADAR_SNAPSHOT_DIR")
          fi
          if [ -n "$RADAR_DATA_DIR" ]; then
            radar_args+=(--radar-data-dir "$RADAR_DATA_DIR")
          fi
          if [ -n "$MARKET_CAP_DATA_PATH" ]; then
            radar_args+=(--market-cap-data "$MARKET_CAP_DATA_PATH")
          fi
          if [ -n "$INSTITUTIONAL_FLOW_DATA_PATH" ]; then
            radar_args+=(--institutional-flow-data "$INSTITUTIONAL_FLOW_DATA_PATH")
          fi
          if [ -n "$MARGIN_SHORT_DATA_PATH" ]; then
            radar_args+=(--margin-short-data "$MARGIN_SHORT_DATA_PATH")
          fi
          if [ -n "$BORROW_LENDING_DATA_PATH" ]; then
            radar_args+=(--borrow-lending-data "$BORROW_LENDING_DATA_PATH")
          fi
          if [ -n "$DAY_TRADING_DATA_PATH" ]; then
            radar_args+=(--day-trading-data "$DAY_TRADING_DATA_PATH")
          fi
          if [ -n "$SENTIMENT_DATA_PATH" ]; then
            radar_args+=(--sentiment-data "$SENTIMENT_DATA_PATH")
          fi
          python -m backtest_lab.stock_pool_observation \
            --pool-id "${{ steps.observation-inputs.outputs.pool_id }}" \
            --signal-date "${{ steps.observation-inputs.outputs.signal_date }}" \
            --warmup-start 2020-01-02 \
            --cache-dir backtest_cache/stock_pool_observations \
            --output-root outputs/stock_pool_observations \
            --tw50-constituents data/tw50_constituents.csv \
            --require-exact-signal-date \
            "${radar_args[@]}"

      - name: Audit optional risk-factor data readiness
        if: steps.schedule-gate.outputs.should_run == 'true'
        shell: bash
        env:
          PYTHONPATH: src
          RADAR_DATA_DIR: ${{ steps.observation-inputs.outputs.radar_data_dir }}
          MARKET_CAP_DATA_PATH: ${{ steps.observation-inputs.outputs.market_cap_data }}
          INSTITUTIONAL_FLOW_DATA_PATH: ${{ vars.INSTITUTIONAL_FLOW_DATA_PATH }}
          MARGIN_SHORT_DATA_PATH: ${{ vars.MARGIN_SHORT_DATA_PATH }}
          BORROW_LENDING_DATA_PATH: ${{ vars.BORROW_LENDING_DATA_PATH }}
          DAY_TRADING_DATA_PATH: ${{ vars.DAY_TRADING_DATA_PATH }}
          SENTIMENT_DATA_PATH: ${{ vars.SENTIMENT_DATA_PATH }}
        run: |
          date_key="${{ steps.observation-inputs.outputs.signal_date }}"
          date_key="${date_key//-/}"
          output_dir="outputs/stock_pool_observations/${date_key}"
          mkdir -p "$output_dir"
          python -m backtest_lab.risk_factor_readiness \
            --signal-date "${{ steps.observation-inputs.outputs.signal_date }}" \
            --radar-data-dir "$RADAR_DATA_DIR" \
            --market-cap-data "$MARKET_CAP_DATA_PATH" \
            --institutional-flow-data "$INSTITUTIONAL_FLOW_DATA_PATH" \
            --margin-short-data "$MARGIN_SHORT_DATA_PATH" \
            --borrow-lending-data "$BORROW_LENDING_DATA_PATH" \
            --day-trading-data "$DAY_TRADING_DATA_PATH" \
            --sentiment-data "$SENTIMENT_DATA_PATH" \
            --output-json "${output_dir}/risk_factor_readiness.json" \
            --output-csv "${output_dir}/risk_factor_readiness_signals.csv"

      - name: Check whether latest observation PDF exists
        if: steps.schedule-gate.outputs.should_run == 'true'
        id: observation-pdf
        shell: bash
        run: |
          path="outputs/stock_pool_observations/$(echo '${{ steps.observation-inputs.outputs.signal_date }}' | tr -d '-')/AI股票池觀察總覽_最新版_v20260612.pdf"
          if [ -f "$path" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No latest observation PDF produced; skip Drive overwrite."
          fi

      - name: Publish latest PDF to Google Drive
        if: steps.schedule-gate.outputs.should_run == 'true' && steps.observation-pdf.outputs.exists == 'true'
        env:
          PYTHONPATH: src
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          STOCK_POOL_OBSERVATION_DRIVE_FOLDER_ID: ${{ secrets.STOCK_POOL_OBSERVATION_DRIVE_FOLDER_ID || vars.STOCK_POOL_OBSERVATION_DRIVE_FOLDER_ID || '1O6Se-HfI7ZDTQ-LWeAO6f8vtvoLcCzIj' }}
          STOCK_POOL_OBSERVATION_DRIVE_FILE_ID: ${{ secrets.STOCK_POOL_OBSERVATION_DRIVE_FILE_ID || vars.STOCK_POOL_OBSERVATION_DRIVE_FILE_ID }}
        run: |
          python -m backtest_lab.drive_publish \
            --folder-id "$STOCK_POOL_OBSERVATION_DRIVE_FOLDER_ID" \
            --file-id "$STOCK_POOL_OBSERVATION_DRIVE_FILE_ID" \
            --remote-name "AI股票池觀察總覽_最新版_v20260612.pdf" \
            --file "${{ steps.observation-pdf.outputs.path }}"

      - name: Upload observation artifact
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-pool-observations-${{ steps.observation-inputs.outputs.signal_date }}
          path: outputs/stock_pool_observations/
          if-no-files-found: error
