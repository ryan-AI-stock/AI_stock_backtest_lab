name: Model Scorecard Delayed Report

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD. Defaults to shared schedule target date."
        required: false
        type: string
      tracking_start:
        description: "Scorecard simulation start date."
        required: false
        type: string
        default: "2026-05-29"
  schedule:
    # Start after the best-strategy report window. The public scorecard is delayed by 7 calendar days.
    - cron: "20 8 * * 1-5"

jobs:
  model-scorecard-report:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared schedule rules
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          path: AI_stock_schedule_rules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shared daily schedule gate
        id: schedule-gate
        shell: bash
        working-directory: AI_stock_schedule_rules
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          manual_args=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            manual_args="--manual-dispatch"
          fi
          python -m stock_schedule_rules.gate \
            --profile daily \
            $manual_args \
            --github-output "$GITHUB_OUTPUT"

      - name: Skip report when schedule gate is closed
        if: steps.schedule-gate.outputs.should_run != 'true'
        run: |
          echo "Schedule gate closed: ${{ steps.schedule-gate.outputs.reason }}"
          echo "No scorecard generated for this run."

      - name: Install dependencies and Chinese font
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve report inputs
        if: steps.schedule-gate.outputs.should_run == 'true'
        id: report-inputs
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.schedule-gate.outputs.target_date }}" ]; then
            echo "report_date=${{ steps.schedule-gate.outputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "report_date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.tracking_start }}" ]; then
            echo "tracking_start=${{ inputs.tracking_start }}" >> "$GITHUB_OUTPUT"
          else
            echo "tracking_start=2026-05-29" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate delayed model scorecard
        if: steps.schedule-gate.outputs.should_run == 'true'
        id: scorecard
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          date_key="${{ steps.report-inputs.outputs.report_date }}"
          date_key="${date_key//-/}"
          rm -rf "outputs/model_scorecard_report/${date_key}"
          python -m backtest_lab.model_scorecard_report \
            --config configs/ep05_universe.json \
            --strategy-config configs/frozen_cycle_proven_top1_v1.json \
            --group-id group_c_0050_00631l_plus_mega_caps \
            --report-date "${{ steps.report-inputs.outputs.report_date }}" \
            --tracking-start "${{ steps.report-inputs.outputs.tracking_start }}" \
            --initial-cash 1328709 \
            --cache-dir backtest_cache/model_scorecard_report \
            --output-root outputs/model_scorecard_report

      - name: Publish latest PDF to Google Drive
        if: steps.schedule-gate.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SCORECARD_REPORT_DRIVE_FOLDER_ID: ${{ secrets.SCORECARD_REPORT_DRIVE_FOLDER_ID || vars.SCORECARD_REPORT_DRIVE_FOLDER_ID || '1NDqeKNo3Sa08t0PUqWiSkCLQTZGfKHIe' }}
          SCORECARD_REPORT_DRIVE_FILE_ID: ${{ secrets.SCORECARD_REPORT_DRIVE_FILE_ID || vars.SCORECARD_REPORT_DRIVE_FILE_ID }}
        run: |
          python -m backtest_lab.drive_publish \
            --folder-id "$SCORECARD_REPORT_DRIVE_FOLDER_ID" \
            --file-id "$SCORECARD_REPORT_DRIVE_FILE_ID" \
            --remote-name "AI模型延遲公開成績單_最新版_v20260612.pdf" \
            --file "outputs/model_scorecard_report/$(echo '${{ steps.report-inputs.outputs.report_date }}' | tr -d '-')/AI模型延遲公開成績單_最新版_v20260612.pdf"

      - name: Upload audit artifact
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-scorecard-report-${{ steps.report-inputs.outputs.report_date }}
          path: outputs/model_scorecard_report/
          if-no-files-found: error
