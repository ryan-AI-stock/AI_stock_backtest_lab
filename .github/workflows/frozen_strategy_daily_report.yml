name: Best Strategy Daily Report

on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: "Signal date in YYYY-MM-DD. Defaults to today's date in Asia/Taipei."
        required: false
        type: string

jobs:
  best-strategy-report:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared schedule rules
        uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          path: AI_stock_schedule_rules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shared daily schedule gate
        id: schedule-gate
        shell: bash
        working-directory: AI_stock_schedule_rules
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          manual_args=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            manual_args="--manual-dispatch"
          fi
          python -m stock_schedule_rules.gate \
            --profile daily \
            $manual_args \
            --github-output "$GITHUB_OUTPUT"

      - name: Skip report when schedule gate is closed
        if: steps.schedule-gate.outputs.should_run != 'true'
        run: |
          echo "Schedule gate closed: ${{ steps.schedule-gate.outputs.reason }}"
          echo "No report generated for this run."

      - name: Install dependencies and Chinese font
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve signal date
        if: steps.schedule-gate.outputs.should_run == 'true'
        id: signal-date
        shell: bash
        run: |
          if [ -n "${{ inputs.signal_date }}" ]; then
            echo "value=${{ inputs.signal_date }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.schedule-gate.outputs.target_date }}" ]; then
            echo "value=${{ steps.schedule-gate.outputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare optional personal portfolio store
        if: steps.schedule-gate.outputs.should_run == 'true'
        shell: bash
        env:
          PORTFOLIO_STORE_JSON: ${{ secrets.PORTFOLIO_STORE_JSON }}
        run: |
          if [ -n "$PORTFOLIO_STORE_JSON" ]; then
            mkdir -p work/portfolio_app
            printf '%s' "$PORTFOLIO_STORE_JSON" > work/portfolio_app/portfolio_store.json
          fi

      - name: Generate report, retry hourly until complete data is available
        if: steps.schedule-gate.outputs.should_run == 'true'
        id: report
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          ready=false
          date_key="${{ steps.signal-date.outputs.value }}"
          date_key="${date_key//-/}"
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt ${attempt}: $(TZ=Asia/Taipei date)"
            rm -rf "outputs/frozen_strategy_monitor/${date_key}"
            set +e
            python -m backtest_lab.frozen_strategy_monitor \
              --config configs/ep05_universe.json \
              --strategy-config configs/frozen_cycle_proven_top1_v1.json \
              --group-id group_c_0050_00631l_plus_mega_caps \
              --signal-date "${{ steps.signal-date.outputs.value }}" \
              --cache-dir backtest_cache/frozen_strategy_monitor \
              --output-root outputs/frozen_strategy_monitor
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              ready=true
              break
            fi
            if [ "$exit_code" -ne 3 ]; then
              exit "$exit_code"
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 3600
            fi
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Upload audit artifact
        if: steps.schedule-gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: best-strategy-report-${{ steps.signal-date.outputs.value }}
          path: outputs/frozen_strategy_monitor/
          if-no-files-found: error
