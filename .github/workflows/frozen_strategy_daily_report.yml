name: Best Strategy Daily Report

on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: "Signal date in YYYY-MM-DD. Defaults to today's date in Asia/Taipei."
        required: false
        type: string
  schedule:
    # Start at 15:00 Asia/Taipei, Monday-Friday. The job retries hourly when final data is incomplete.
    - cron: "0 7 * * 1-5"

jobs:
  best-strategy-report:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve signal date
        id: signal-date
        shell: bash
        run: |
          if [ -n "${{ inputs.signal_date }}" ]; then
            echo "value=${{ inputs.signal_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate report, retry hourly until complete data is available
        id: report
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          ready=false
          date_key="${{ steps.signal-date.outputs.value }}"
          date_key="${date_key//-/}"
          for attempt in 1 2 3 4 5 6; do
            echo "Attempt ${attempt}: $(TZ=Asia/Taipei date)"
            rm -rf "outputs/frozen_strategy_monitor/${date_key}"
            set +e
            python -m backtest_lab.frozen_strategy_monitor \
              --config configs/ep05_universe.json \
              --strategy-config configs/frozen_cycle_proven_top1_v1.json \
              --group-id group_c_0050_00631l_plus_mega_caps \
              --signal-date "${{ steps.signal-date.outputs.value }}" \
              --cache-dir backtest_cache/frozen_strategy_monitor \
              --output-root outputs/frozen_strategy_monitor
            exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              ready=true
              break
            fi
            if [ "$exit_code" -ne 3 ]; then
              exit "$exit_code"
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 3600
            fi
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Publish latest PDF to Google Drive
        if: steps.report.outputs.ready == 'true'
        env:
          PYTHONPATH: src
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          FROZEN_REPORT_DRIVE_FOLDER_ID: ${{ secrets.FROZEN_REPORT_DRIVE_FOLDER_ID || vars.FROZEN_REPORT_DRIVE_FOLDER_ID }}
          FROZEN_REPORT_DRIVE_FILE_ID: ${{ secrets.FROZEN_REPORT_DRIVE_FILE_ID || vars.FROZEN_REPORT_DRIVE_FILE_ID }}
        run: |
          python -m backtest_lab.drive_publish \
            --file "outputs/frozen_strategy_monitor/$(echo '${{ steps.signal-date.outputs.value }}' | tr -d '-')/AI股票最佳策略每日觀察報告_最新版_v20260605.pdf"

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-strategy-report-${{ steps.signal-date.outputs.value }}
          path: outputs/frozen_strategy_monitor/
          if-no-files-found: error
